name: linmail-pdn

# Builds linmail-pdn (the mail server as a standalone packet.net app, see
# pdn/README.md) and runs its tests: the fake RHP server and web suites, the
# same under AddressSanitizer, runs against a real pdn node from the latest
# packet.net release and a LinBPQ built from this tree (including pdn starting
# the app package and serving its pages through the app gateway), and finally
# installs the amd64 .deb and runs that against a real pdn. Each step is one
# stage of pdn/tests/ci.sh, which the upstream sync workflow runs as a whole.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linmail-pdn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: pdn/tests/ci.sh deps

      - name: Build linmail-pdn, and with AddressSanitizer
        run: pdn/tests/ci.sh build

      - name: Build LinBPQ (for the real pdn tests)
        run: pdn/tests/ci.sh linbpq

      - name: Fetch the latest pdn node release
        env:
          GH_TOKEN: ${{ github.token }}
        run: pdn/tests/ci.sh pdn

      - name: Tests against a fake RHP server, and the web pages
        run: pdn/tests/ci.sh fake

      - name: The same, under AddressSanitizer
        run: pdn/tests/ci.sh asan

      - name: Tests against a real pdn node and LinBPQ
        run: pdn/tests/ci.sh real

      - name: Build the amd64 .deb (Debian bookworm container)
        run: pdn/tests/ci.sh debbuild

      - name: Install the .deb and run it against a real pdn node
        run: pdn/tests/ci.sh deb

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linmail-pdn-junit
          path: pdn/reports/
          if-no-files-found: warn
